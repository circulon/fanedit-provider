name: Build and Publish Docker Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

env:
  IMAGE_NAME: circulon/fanedit-provider

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      should_run: ${{ steps.check_tag.outputs.should_run }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Extract version from pyproject.toml
        id: get_version
        uses: SebRollen/toml-action@v1.2.0
        with:
          file: pyproject.toml
          field: project.version

      - name: Check if version already exists on Docker Hub
        id: check_tag
        run: |
          VERSION="${{ steps.get_version.outputs.value }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://hub.docker.com/v2/repositories/${{ env.IMAGE_NAME }}/tags/v${VERSION}/")
          if [ "$STATUS" = "200" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Version v${VERSION} already exists on Docker Hub - skipping build"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Version v${VERSION} not found on Docker Hub (status $STATUS) - proceeding with build"
          fi

  build-and-push:
    needs: check-version
    if: needs.check-version.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ needs.check-version.outputs.version }}
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sync-readme:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Push README to Docker Hub
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          readme-filepath: ./README.md
          short-description: "A Plex-compatible Metadata Provider for FanEdit Movies"
